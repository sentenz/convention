# SPDX-License-Identifier: Apache-2.0

name: Zensical
description: Build documentation with Zensical's classic theme and Markdown compatibility extensions.
author: "sentenz"

inputs:
  python-version:
    description: Python version to use.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --quiet -r requirements-docs.txt

    - name: Test Documentation Publication
      shell: bash
      run: python -m unittest discover -s tests/docs -v

    - name: Build Site
      shell: bash
      run: python scripts/docs.py build

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="logo-title logo-description"
>
  <title id="logo-title">SENTENZ</title>
  <desc id="logo-description">
    A rounded purple tile with a flowing S and a pink terminal point.
  </desc>

  <style>
    :root {
      --md-sys-color-primary: #6442d6;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-tertiary-container: #f1d3f9;
    }

    .logo-container {
      fill: var(--md-sys-color-primary, #6442d6);
    }

    .logo-mark {
      fill: none;
      stroke: var(--md-sys-color-on-primary, #ffffff);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 68;
    }

    .logo-terminal {
      fill: var(--md-sys-color-tertiary-container, #f1d3f9);
    }
  </style>

  <rect class="logo-container" x="32" y="32" width="448" height="448" rx="112" />
  <path
    class="logo-mark"
    d="
      M 374 150
      C 340 116 298 104 246 104
      C 170 104 116 138 116 190
      C 116 240 158 258 256 268
      C 354 278 396 300 396 350
      C 396 404 340 438 264 438
      C 206 438 160 422 128 388
    "
  />
  <circle class="logo-terminal" cx="128" cy="388" r="24" />
</svg>
